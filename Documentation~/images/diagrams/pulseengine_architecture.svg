<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Sleek Arrow Markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <style>
    .diagram-bg { fill: url(#bgGrad); stroke: #30363d; stroke-width: 1.5; rx: 12px; }
    .card-panel { fill: #161b22; stroke: #30363d; stroke-width: 1.2; rx: 8px; }
    .inner-panel { fill: #0d1117; stroke: #21262d; stroke-width: 1; rx: 6px; }
    .kicker { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #8b949e; line-height: 1.4; }
    .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #58a6ff; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="500" class="diagram-bg" />

  <!-- Diagram Header -->
  <g transform="translate(32, 34)">
    <text x="0" y="0" class="kicker" fill="#38bdf8">SYSTEM PIPELINE &amp; SIGNAL MATRIX</text>
    <text x="0" y="22" class="title" style="font-size: 18px; font-weight: 700;">PulseEngine Real-Time Telemetry &amp; DAW Ingestion Architecture</text>
  </g>

  <!-- COLUMN 1: MULTI-PROTOCOL INGESTION (X: 32, W: 220) -->
  <g transform="translate(32, 90)">
    <rect width="220" height="376" class="card-panel" />
    <rect x="0" y="0" width="4" height="376" fill="#38bdf8" rx="2" />

    <text x="18" y="24" class="kicker" fill="#38bdf8">LAYER 01 • INGESTION</text>
    <text x="18" y="44" class="title">Telemetry Sources</text>
    <text x="18" y="62" class="sub">Decoupled network &amp; serial IO</text>

    <!-- Source 1: OSC / UDP -->
    <g transform="translate(14, 76)">
      <rect width="192" height="60" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #38bdf8;">OSC / UDP Receiver</text>
      <text x="12" y="36" class="sub">Port 8000 / 9000 • Packet parser</text>
      <text x="12" y="50" class="code">/telemetry/heart_rate</text>
    </g>

    <!-- Source 2: WebSockets -->
    <g transform="translate(14, 146)">
      <rect width="192" height="60" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #38bdf8;">WebSocket Client</text>
      <text x="12" y="36" class="sub">JSON &amp; Binary frames</text>
      <text x="12" y="50" class="code">ws://127.0.0.1:8080/hrv</text>
    </g>

    <!-- Source 3: Serial COM / BLE -->
    <g transform="translate(14, 216)">
      <rect width="192" height="60" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #38bdf8;">Serial COM &amp; BLE</text>
      <text x="12" y="36" class="sub">Baud 115200 • Microcontrollers</text>
      <text x="12" y="50" class="code">Arduino / ESP32 PPG</text>
    </g>

    <!-- Source 4: Generative Sim -->
    <g transform="translate(14, 286)">
      <rect width="192" height="72" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #38bdf8;">Generative Simulator</text>
      <text x="12" y="36" class="sub">Synthetic ECG / Perlin Noise</text>
      <text x="12" y="50" class="code">Offline Dev &amp; Stress Test</text>
      <text x="12" y="64" class="sub" style="font-size: 9.5px; fill:#34d399;">Active in Editor Play Mode</text>
    </g>
  </g>

  <!-- COLUMN 2: PULSEENGINE CORE ENGINE (X: 284, W: 380) -->
  <g transform="translate(284, 90)">
    <rect width="380" height="376" class="card-panel" stroke="#f59e0b" stroke-dasharray="4 2" />
    <rect x="0" y="0" width="4" height="376" fill="#f59e0b" rx="2" />

    <text x="20" y="24" class="kicker" fill="#f59e0b">CORE PIPELINE • PULSEENGINE</text>
    <text x="20" y="44" class="title">Zero-GC Routing Bus &amp; DAW Console</text>
    <text x="20" y="62" class="sub">High-frequency normalizer and digital audio workstation strip</text>

    <!-- Stage A: DataStreamRegistry -->
    <g transform="translate(16, 76)">
      <rect width="348" height="74" class="inner-panel" stroke="#38bdf8" stroke-width="0.8" />
      <text x="14" y="20" class="title" style="font-size: 13px; fill: #38bdf8;">DataStreamRegistry (Singleton Bus)</text>
      <text x="14" y="38" class="sub">• Lock-free concurrent queue (thread-safe background ingestion)</text>
      <text x="14" y="52" class="sub">• Pre-allocated channels with automatic packet sniffer discovery</text>
      <text x="14" y="66" class="code" style="font-size: 10px;">PushRawValue(channelId, float) ➔ 0 B Heap Allocation</text>
    </g>

    <!-- Stage B: DAW Mixer Console Strip -->
    <g transform="translate(16, 160)">
      <rect width="348" height="110" class="inner-panel" stroke="#f59e0b" stroke-width="0.8" />
      <text x="14" y="20" class="title" style="font-size: 13px; fill: #f59e0b;">DAW Mixer Channel Strip (DSP Filter)</text>
      
      <!-- Visual Fader Graphic -->
      <g transform="translate(14, 30)">
        <text x="0" y="14" class="sub">1. Linear Range Remap:</text>
        <text x="150" y="14" class="code" style="fill:#fbbf24;">[rawMin, rawMax] ➔ [0.0, 1.0]</text>
        
        <text x="0" y="34" class="sub">2. Anti-Jitter Filter:</text>
        <text x="150" y="34" class="code" style="fill:#fbbf24;">Exponential Moving Avg (EMA)</text>
        
        <text x="0" y="54" class="sub">3. Channel Controls:</text>
        <text x="150" y="54" class="sub" style="fill:#e6edf3;">Gain • Offset • Invert • Mute • Solo</text>

        <text x="0" y="74" class="sub">4. Monitoring:</text>
        <text x="150" y="74" class="code" style="fill:#34d399;">Peak VU Meter &amp; Rolling History Wave</text>
      </g>
    </g>

    <!-- Stage C: Binders & Modulators -->
    <g transform="translate(16, 280)">
      <rect width="348" height="78" class="inner-panel" stroke="#34d399" stroke-width="0.8" />
      <text x="14" y="20" class="title" style="font-size: 13px; fill: #34d399;">Binders &amp; Metronome Clock</text>
      <text x="14" y="38" class="sub">• <tspan class="code">DataStreamPropertyBinder</tspan> — Fast cached reflection / direct field</text>
      <text x="14" y="54" class="sub">• <tspan class="code">DataStreamColorBinder</tspan> — Multi-stop gradient remapping</text>
      <text x="14" y="70" class="sub">• <tspan class="code">DataStreamMetronome</tspan> — Cardiac systolic impulse triggers</text>
    </g>
  </g>

  <!-- COLUMN 3: RECEIVERS & COMPANION INTEGRATION (X: 696, W: 232) -->
  <g transform="translate(696, 90)">
    <rect width="232" height="376" class="card-panel" />
    <rect x="0" y="0" width="4" height="376" fill="#c084fc" rx="2" />

    <text x="18" y="24" class="kicker" fill="#c084fc">LAYER 03 • TARGETS</text>
    <text x="18" y="44" class="title">Modulated Outputs</text>
    <text x="18" y="62" class="sub">Generative XR endpoints</text>

    <!-- Target 1: VolumetricSDF -->
    <g transform="translate(14, 76)">
      <rect width="204" height="74" class="inner-panel" stroke="#c084fc" stroke-width="1" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #c084fc;">VolumetricSDF Package</text>
      <text x="12" y="36" class="sub">Companion Implicit CSG Engine</text>
      <text x="12" y="52" class="code">SdfGroupController</text>
      <text x="12" y="66" class="sub" style="font-size:9.5px; fill:#34d399;">Softness • Radius • Twist</text>
    </g>

    <!-- Target 2: Unity VFX Graph -->
    <g transform="translate(14, 160)">
      <rect width="204" height="66" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #f43f5e;">Unity VFX Graph</text>
      <text x="12" y="36" class="sub">GPU Particle Swarms</text>
      <text x="12" y="52" class="code">SpawnRate • Turbulence</text>
    </g>

    <!-- Target 3: Shader Graph & MatCaps -->
    <g transform="translate(14, 236)">
      <rect width="204" height="66" class="inner-panel" />
      <text x="12" y="20" class="title" style="font-size: 12px; fill: #38bdf8;">Materials &amp; Shaders</text>
      <text x="12" y="36" class="sub">URP / HDRP Surface Uniforms</text>
      <text x="12" y="52" class="code">_BaseColor • _Emission</text>
    </g>

    <!-- Target 4: Audio DSP -->
    <g transform="translate(14, 312)">
      <rect width="204" height="52" class="inner-panel" />
      <text x="12" y="18" class="title" style="font-size: 12px; fill: #f59e0b;">Audio DSP &amp; Haptics</text>
      <text x="12" y="34" class="sub">Synthesizer Pitch • VR Rumble</text>
    </g>
  </g>

  <!-- CONNECTOR BUS LINES -->
  <!-- Line 1: Sources -> Registry -->
  <path d="M 252 278 L 282 278" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)" />

  <!-- Line 2: Modulators -> Targets -->
  <path d="M 664 330 L 694 330" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald)" />

</svg>
